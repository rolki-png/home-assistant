title: Home
views:
  - title: Home
    path: home
    icon: mdi:home
    cards:
      - type: custom:mushroom-chips-card
        chips:
          - type: weather
            entity: weather.forecast_home
            show_temperature: true
            show_conditions: true
          - type: entity
            entity: person.roland
            use_entity_picture: true
          - type: template
            icon: mdi:sun-clock
            content: "{{ now().strftime('%A, %d %B') }}"
        alignment: center

      - type: custom:mushroom-title-card
        title: Salus iT600 (Heating)
        subtitle: Duplex

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-climate-card
            entity: climate.home_konyha
            name: Bedroom (ground floor)
            icon: mdi:thermometer
            show_temperature_control: true
            collapsible_controls: true
            tap_action:
              action: more-info

          - type: custom:mushroom-climate-card
            entity: climate.home_konyha_emelet
            name: Kitchen (first floor)
            icon: mdi:thermometer
            show_temperature_control: true
            collapsible_controls: true
            tap_action:
              action: more-info

      - type: custom:mushroom-title-card
        title: Living Room
        subtitle: null

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-media-player-card
            entity: media_player.65_crystal_uhd_ue65u8092fuxxh
            name: Samsung TV
            icon: mdi:television
            use_media_info: true
            show_volume_level: true
            media_controls:
              - on_off
              - play_pause_stop
            volume_controls:
              - volume_buttons
              - volume_mute
            collapsible_controls: true

          - type: custom:mushroom-media-player-card
            entity: media_player.65_crystal_uhd
            name: TV Cast
            icon: mdi:cast
            use_media_info: true
            collapsible_controls: true

      - type: custom:mushroom-title-card
        title: Kitchen
        subtitle: null

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-media-player-card
            entity: media_player.kitchen_speaker
            name: Kitchen Speaker
            icon: mdi:speaker
            use_media_info: true
            show_volume_level: true
            volume_controls:
              - volume_buttons
              - volume_mute
            collapsible_controls: true

          - type: custom:mushroom-template-card
            entity: sensor.dishwasher_operation_state
            primary: Dishwasher
            secondary: >-
              {{ states('sensor.dishwasher_operation_state') | replace('_', ' ')
              | title }} {% if
              states('sensor.dishwasher_programme_progress') not in ['unknown',
              'unavailable', '0'] %} - {{
              states('sensor.dishwasher_programme_progress') }}% {% endif %}
            icon: mdi:dishwasher
            icon_color: |-
              {% set state = states('sensor.dishwasher_operation_state') %}
              {% if state == 'run' %}blue
              {% elif state == 'finished' %}green
              {% elif state == 'ready' %}amber
              {% else %}grey
              {% endif %}
            tap_action:
              action: more-info

          - type: custom:mushroom-entity-card
            entity: sensor.dishwasher_door
            name: Door
            icon: mdi:door

          - type: custom:mushroom-entity-card
            entity: switch.dishwasher_power
            name: Power
            tap_action:
              action: toggle

      - type: custom:mushroom-title-card
        title: Bedroom
        subtitle: null

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-media-player-card
            entity: media_player.bedroom_speaker
            name: Bedroom Speaker
            icon: mdi:speaker
            use_media_info: true
            show_volume_level: true
            volume_controls:
              - volume_buttons
              - volume_mute
            collapsible_controls: true

      - type: custom:mushroom-title-card
        title: Bathroom
        subtitle: null

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.washing_machine
            primary: Washing Machine
            secondary: >-
              {{ states('sensor.washing_machine') | replace('_', ' ') | title }}
              {% if states('sensor.washing_machine_remaining_time') not in
              ['unknown', 'unavailable', '0'] %} - {{
              states('sensor.washing_machine_remaining_time') | int }} min left
              {% endif %}
            icon: mdi:washing-machine
            icon_color: |-
              {% set state = states('sensor.washing_machine') %}
              {% if state == 'in_use' %}blue
              {% elif state == 'program_ended' %}green
              {% elif state == 'idle' %}grey
              {% else %}amber
              {% endif %}
            tap_action:
              action: more-info

          - type: custom:mushroom-entity-card
            entity: sensor.washing_machine_programme
            name: Programme
            icon: mdi:format-list-bulleted

          - type: custom:mushroom-entity-card
            entity: sensor.washing_machine_programme_phase
            name: Phase
            icon: mdi:progress-clock

          - type: custom:mushroom-entity-card
            entity: binary_sensor.washing_machine_door
            name: Door

          - type: custom:mushroom-entity-card
            entity: switch.washing_machine_power
            name: Power
            tap_action:
              action: toggle

      - type: custom:mushroom-title-card
        title: Office
        subtitle: null

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: switch.shelly1pmminig3_d0cf13cfe9c8
            name: Smart Switch
            icon: mdi:power-socket-eu
            tap_action:
              action: toggle

          - type: custom:mushroom-template-card
            entity: sensor.shelly1pmminig3_d0cf13cfe9c8_power
            primary: Power Usage
            secondary: "{{ states('sensor.shelly1pmminig3_d0cf13cfe9c8_power') | round(1) }} W"
            icon: mdi:lightning-bolt
            icon_color: |-
              {% set power = states('sensor.shelly1pmminig3_d0cf13cfe9c8_power') | float(0) %}
              {% if power > 100 %}red
              {% elif power > 50 %}amber
              {% elif power > 0 %}green
              {% else %}grey
              {% endif %}

          - type: custom:mushroom-template-card
            entity: sensor.shelly1pmminig3_d0cf13cfe9c8_energy
            primary: Energy Used
            secondary: "{{ states('sensor.shelly1pmminig3_d0cf13cfe9c8_energy') | round(2) }} kWh"
            icon: mdi:meter-electric
            icon_color: blue

          - type: custom:mushroom-entity-card
            entity: sensor.canon_gx4000_series
            name: Printer
            icon: mdi:printer

      - type: custom:mushroom-title-card
        title: Printer Ink
        subtitle: null

      - type: grid
        columns: 4
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: Black
            secondary: "{{ states('sensor.canon_gx4000_series_black_pgbk') }}%"
            icon: mdi:water
            icon_color: grey

          - type: custom:mushroom-template-card
            primary: Cyan
            secondary: "{{ states('sensor.canon_gx4000_series_cyan') }}%"
            icon: mdi:water
            icon_color: cyan

          - type: custom:mushroom-template-card
            primary: Magenta
            secondary: "{{ states('sensor.canon_gx4000_series_magenta') }}%"
            icon: mdi:water
            icon_color: pink

          - type: custom:mushroom-template-card
            primary: Yellow
            secondary: "{{ states('sensor.canon_gx4000_series_yellow') }}%"
            icon: mdi:water
            icon_color: amber

      - type: custom:mushroom-title-card
        title: Utilities
        subtitle: null

      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: todo.shopping_list
            name: Shopping List
            icon: mdi:cart
            tap_action:
              action: more-info

          - type: custom:mushroom-template-card
            entity: sensor.sun_next_rising
            primary: Sunrise
            secondary: "{{ as_timestamp(states('sensor.sun_next_rising')) | timestamp_custom('%H:%M') }}"
            icon: mdi:weather-sunset-up
            icon_color: amber

          - type: custom:mushroom-template-card
            entity: sensor.sun_next_setting
            primary: Sunset
            secondary: "{{ as_timestamp(states('sensor.sun_next_setting')) | timestamp_custom('%H:%M') }}"
            icon: mdi:weather-sunset-down
            icon_color: deep-orange

  - title: Appliances
    path: appliances
    icon: mdi:washing-machine
    cards:
      - type: custom:mushroom-title-card
        title: Dishwasher
        subtitle: null

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.dishwasher_operation_state
            primary: Dishwasher
            secondary: "{{ states('sensor.dishwasher_operation_state') | replace('_', ' ') | title }}"
            icon: mdi:dishwasher
            icon_color: |-
              {% set state = states('sensor.dishwasher_operation_state') %}
              {% if state == 'run' %}blue
              {% elif state == 'finished' %}green
              {% else %}grey
              {% endif %}
            layout: vertical

          - type: custom:mushroom-entity-card
            entity: switch.dishwasher_power
            name: Power
            tap_action:
              action: toggle

          - type: custom:mushroom-entity-card
            entity: sensor.dishwasher_door
            name: Door State

          - type: custom:mushroom-entity-card
            entity: sensor.dishwasher_programme_progress
            name: Progress

          - type: custom:mushroom-entity-card
            entity: sensor.dishwasher_programme_finish_time
            name: Finish Time

          - type: custom:mushroom-entity-card
            entity: select.dishwasher_selected_programme
            name: Programme

          - type: custom:mushroom-entity-card
            entity: binary_sensor.dishwasher_remote_control
            name: Remote Control

          - type: custom:mushroom-entity-card
            entity: binary_sensor.dishwasher_remote_start
            name: Remote Start

      - type: custom:mushroom-title-card
        title: Washing Machine
        subtitle: null

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.washing_machine
            primary: Washing Machine
            secondary: "{{ states('sensor.washing_machine') | replace('_', ' ') | title }}"
            icon: mdi:washing-machine
            icon_color: |-
              {% set state = states('sensor.washing_machine') %}
              {% if state == 'in_use' %}blue
              {% elif state == 'program_ended' %}green
              {% else %}grey
              {% endif %}
            layout: vertical

          - type: custom:mushroom-entity-card
            entity: switch.washing_machine_power
            name: Power
            tap_action:
              action: toggle

          - type: custom:mushroom-entity-card
            entity: binary_sensor.washing_machine_door
            name: Door

          - type: custom:mushroom-entity-card
            entity: sensor.washing_machine_programme
            name: Programme

          - type: custom:mushroom-entity-card
            entity: sensor.washing_machine_programme_phase
            name: Phase

          - type: custom:mushroom-entity-card
            entity: sensor.washing_machine_remaining_time
            name: Remaining Time

          - type: custom:mushroom-entity-card
            entity: sensor.washing_machine_target_temperature
            name: Temperature

          - type: custom:mushroom-entity-card
            entity: sensor.washing_machine_spin_speed
            name: Spin Speed

          - type: custom:mushroom-entity-card
            entity: sensor.washing_machine_energy_consumption
            name: Energy Used

          - type: custom:mushroom-entity-card
            entity: sensor.washing_machine_water_consumption
            name: Water Used

  - title: Media
    path: media
    icon: mdi:play-circle
    cards:
      - type: custom:mushroom-title-card
        title: TV & Speakers
        subtitle: null

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-media-player-card
            entity: media_player.65_crystal_uhd_ue65u8092fuxxh
            name: Samsung TV
            icon: mdi:television
            use_media_info: true
            show_volume_level: true
            media_controls:
              - on_off
              - play_pause_stop
              - previous
              - next
            volume_controls:
              - volume_buttons
              - volume_mute
              - volume_set
            collapsible_controls: false

          - type: custom:mushroom-media-player-card
            entity: media_player.kitchen_speaker
            name: Kitchen Speaker
            icon: mdi:speaker
            use_media_info: true
            show_volume_level: true
            media_controls:
              - on_off
              - play_pause_stop
            volume_controls:
              - volume_buttons
              - volume_mute
              - volume_set
            collapsible_controls: false

          - type: custom:mushroom-media-player-card
            entity: media_player.bedroom_speaker
            name: Bedroom Speaker
            icon: mdi:speaker
            use_media_info: true
            show_volume_level: true
            media_controls:
              - on_off
              - play_pause_stop
            volume_controls:
              - volume_buttons
              - volume_mute
              - volume_set
            collapsible_controls: false

          - type: custom:mushroom-media-player-card
            entity: media_player.65_crystal_uhd
            name: TV Cast
            icon: mdi:cast
            use_media_info: true
            show_volume_level: true
            collapsible_controls: false

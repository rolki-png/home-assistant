
# Loads default set of integrations. Do not remove.
default_config:

# Keep a year of local state history in home-assistant_v2.db.
# Energy sensors also write long-term statistics that are not purged.
recorder:
  purge_keep_days: 365
  commit_interval: 30

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

input_number:
  electricity_price_ron:
    name: Electricity price
    min: 0
    max: 10
    step: 0.01
    initial: 1.16
    mode: box
    unit_of_measurement: RON/kWh
    icon: mdi:currency-usd

utility_meter:
  office_switch_energy_daily:
    source: sensor.shelly1pmminig3_d0cf13cfe9c8_energy
    cycle: daily
  office_switch_energy_monthly:
    source: sensor.shelly1pmminig3_d0cf13cfe9c8_energy
    cycle: monthly
  washing_machine_energy_daily:
    source: sensor.washing_machine_energy_consumption
    cycle: daily
  washing_machine_energy_monthly:
    source: sensor.washing_machine_energy_consumption
    cycle: monthly

template: !include templates.yaml
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
